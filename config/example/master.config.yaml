node:
  id: master-01
  name: shepherd-master
  role: master
  tags: []
  metadata:
    arch: amd64
    os: linux
  master_role:
    port: 9190
    scheduler:
      strategy: round_robin
      max_queue_size: 100
      task_timeout: 300
      retry_on_failure: true
      max_retries: 3
  client_role:
    enabled: false
    master_address: ""
    register_retry: 3
    heartbeat_interval: 5
    heartbeat_timeout: 15
  capabilities:
    python_enabled: false
    conda_path: ""
    conda_environments:
      shepherd: ""

server:
  web_port: 9190
  anthropic_port: 9170
  host: 0.0.0.0
  read_timeout: 60
  write_timeout: 60

model:
  paths:
    - ./models
    - ~/.cache/huggingface/hub
  auto_scan: true

llamacpp:
  paths:
    - path: ./llama.cpp
      name: Default
      description: ""

download:
  directory: ./downloads
  max_concurrent: 4
  chunk_size: 1048576
  retry_count: 3
  timeout: 300

model_repo:
  endpoint: hf-mirror.com
  token: ""
  timeout: 30

security:
  api_key_enabled: false
  api_key: ""
  cors_enabled: true
  allowed_origins:
    - "*"

compatibility:
  ollama:
    enabled: true
    port: 11434
  lmstudio:
    enabled: false
    port: 1234

log:
  level: info
  format: json
  output: both
  directory: ./logs
  max_size: 100
  max_backups: 3
  max_age: 7
  compress: true

storage:
  type: sqlite
  sqlite:
    path: ./data/shepherd.db
    enable_wal: true
    pragmas:
      cache_size: "-64000"
      synchronous: "NORMAL"
