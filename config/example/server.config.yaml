server:
    web_port: 9190
    anthropic_port: 9170
    host: 0.0.0.0
    model_bind_host: 0.0.0.0
    read_timeout: 60
    write_timeout: 60
model:
    paths:
        - ./models
        - ~/.cache/huggingface/hub
    path_configs: []
    auto_scan: true
    scan_interval: 300
    port_range: "8081-9000"
multimodal_paths:
    - path: ./models/multimodal
      name: Multimodal Models
      description: "Safetensors model directory (TTS/ASR/Image Generation)"
backends:
    llamacpp:
        paths:
            - path: /usr/local/bin/
              name: Default
    vllm:
        enabled: false
        conda_env: ""
        conda_path: ""
        serve_bin: ""
        extra_args: ""
        default_port: 8000
        env: []
        paths:
            - path: /usr/local/bin/
              name: Default
    vllmomni:
        enabled: false
        conda_env: ""
        conda_path: ""
        serve_bin: ""
        extra_args: ""
        default_port: 8000
        env: []
        paths:
            - path: /usr/local/bin/
              name: Default
download:
    directory: ./downloads
    max_concurrent: 4
    chunk_size: 1048576
    retry_count: 3
    timeout: 300
model_repo:
    endpoint: huggingface.co
    token: ""
    timeout: 30
security:
    api_key_enabled: false
    api_key: ""
    cors_enabled: true
    allowed_origins:
        - '*'
compatibility:
    ollama:
        enabled: false
        port: 11434
    lmstudio:
        enabled: false
        port: 1234
mcp:
    client:
        enabled: true
        call_timeout: 120
        ready_timeout: 30
    server:
        enabled: false
        expose_tts: true
        expose_asr: false
        expose_chat: false
log:
    level: info
    format: json
    output: both
    directory: ./logs
    max_size: 100
    max_backups: 3
    max_age: 7
    compress: true
storage:
    type: sqlite
    sqlite:
        path: ./data/shepherd.db
        pragmas:
            cache_size: "-64000"
            synchronous: NORMAL
        enable_wal: true
    postgresql: null
node:
    id: auto
    name: ""
    role: hybrid
    tags: []
    metadata:
        os: linux
        arch: amd64
    master_role:
        enabled: true
        port: 9190
        api_key: ""
        ssl:
            enabled: false
            cert_path: ""
            key_path: ""
    client_role:
        enabled: true
        master_address: ""
        register_retry: 3
        heartbeat_interval: 5
        heartbeat_timeout: 15
    capabilities:
        python_enabled: false
        conda_path: ""
        conda_environments:
            shepherd: ""
    resources:
        monitor_interval: 10
        report_gpu: true
        report_temperature: true
        gpu_backend: ""
    executor:
        max_concurrent: 5
        task_timeout: 300
        allow_remote_stop: false
        allowed_commands: []
master:
    enabled: false
    client_config_dir: ""
    network_scan:
        enabled: false
        subnets: []
        port_range: ""
        timeout: 5
        auto_discover: false
        interval: 300
    scheduler:
        strategy: round_robin
        max_queue_size: 100
        task_timeout: 300
        retry_on_failure: true
        max_retries: 3
    log_aggregation:
        enabled: false
        max_buffer_size: 1000
        flush_interval: 30
client: null
