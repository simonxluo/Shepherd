host: localhost:9190
info:
  contact:
    name: Shepherd Project
    url: https://github.com/shepherd-project/shepherd
  description: |-
    Shepherd - 分布式 llama.cpp 模型管理系统 API
    提供模型管理、进程管理、配置管理、兼容性API等功能
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Shepherd API
  version: "1.0"
paths:
  /api/chat:
    post:
      consumes:
      - application/json
      description: Ollama 兼容的聊天接口，内部转换为 OpenAI 格式转发
      parameters:
      - description: Ollama chat request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler_ollama.ChatRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Ollama Chat
      tags:
      - Ollama
  /api/tags:
    post:
      description: 获取模型标签列表（Ollama 格式）
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Ollama Tags
      tags:
      - Ollama
  /v1/chat/completions:
    post:
      consumes:
      - application/json
      description: OpenAI 兼容的聊天补全接口，支持流式和非流式响应
      parameters:
      - description: Chat completion request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler_openai.ChatCompletionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler_openai.ChatCompletionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler_openai.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler_openai.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/internal_handler_openai.ErrorResponse'
      summary: OpenAI Chat Completions
      tags:
      - OpenAI
  /v1/completions:
    post:
      consumes:
      - application/json
      description: OpenAI 兼容的文本补全接口
      parameters:
      - description: Completion request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler_openai.CompletionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler_openai.CompletionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler_openai.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler_openai.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/internal_handler_openai.ErrorResponse'
      summary: OpenAI Completions
      tags:
      - OpenAI
  /v1/messages:
    post:
      consumes:
      - application/json
      description: Anthropic 兼容的消息接口，内部转换为 OpenAI 格式转发并转换响应
      parameters:
      - description: Anthropic message request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler_anthropic.MessageRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler_anthropic.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler_anthropic.MessageResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler_anthropic.MessageResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/internal_handler_anthropic.MessageResponse'
      summary: Anthropic Messages
      tags:
      - Anthropic
  /v1/models:
    get:
      description: 获取已加载的模型列表（OpenAI 格式）
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler_openai.ModelsResponse'
      summary: List Models
      tags:
      - OpenAI
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
